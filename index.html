<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stuff to go</title>
  <meta name="description" content="Mes checklists d'affaires à prendre selon l'endroit où je vais.">
  <!-- Couleur de la barre du téléphone, selon le thème clair/sombre -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1d1c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="preload" href="polices/space-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="polices/jetbrains-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Les icônes viennent de la planche icones/tabler.svg :
     <svg class="ic"><use href="icones/tabler.svg#nom"></use></svg> -->

<!-- ============ ÉCRAN DE CONNEXION ============ -->
<section id="ecran-connexion" class="ecran" hidden>
  <div class="connexion">
    <img src="icones/icone.svg" alt="" width="64" height="64">
    <h1>Stuff to go</h1>
    <p class="discret">Mes affaires à prendre, selon où je vais.</p>
    <button id="btn-connexion" class="btn-principal coul-jaune">Se connecter avec Google</button>
    <p id="connexion-erreur" class="erreur" hidden></p>
  </div>
</section>

<!-- ============ ÉCRAN 1 : ACCUEIL (choix des listes) ============ -->
<section id="ecran-accueil" class="ecran" hidden>
  <header class="barre">
    <h1 class="titre">Où vas-tu ?</h1>
    <span class="synchro" title="Synchronisation"><svg class="ic"><use href="icones/tabler.svg#cloud-check"></use></svg></span>
    <button class="btn-icone" data-aller="reglages" aria-label="Réglages"><svg class="ic"><use href="icones/tabler.svg#settings"></use></svg></button>
  </header>
  <div id="recherche-listes" class="recherche" hidden>
    <svg class="ic"><use href="icones/tabler.svg#search"></use></svg>
    <input id="champ-recherche" type="search" placeholder="Chercher une liste">
  </div>
  <ul id="liste-listes" class="lignes"></ul>
  <button id="btn-nouvelle-liste" class="ligne-ajout"><svg class="ic"><use href="icones/tabler.svg#plus"></use></svg>Nouvelle liste</button>
  <div class="pied">
    <button id="btn-preparer" class="btn-principal coul-jaune large"></button>
  </div>
</section>

<!-- ============ ÉCRAN 2 : CHECKLIST (listes fusionnées) ============ -->
<section id="ecran-checklist" class="ecran" hidden>
  <header class="barre">
    <button class="btn-icone" data-aller="accueil" aria-label="Retour"><svg class="ic"><use href="icones/tabler.svg#arrow-left"></use></svg></button>
    <h1 class="titre">Prêt à partir</h1>
    <span id="compteur" class="compteur"></span>
    <span class="synchro" title="Synchronisation"><svg class="ic"><use href="icones/tabler.svg#cloud-check"></use></svg></span>
  </header>
  <div class="progression"><span id="progression"></span></div>
  <div id="pastilles" class="pastilles"></div>
  <div id="checklist"></div>
  <div class="pied">
    <button id="btn-tout-decocher" class="btn large"><svg class="ic"><use href="icones/tabler.svg#refresh"></use></svg>Tout décocher</button>
  </div>
</section>

<!-- ============ ÉCRAN 3 : MODIFIER UNE LISTE ============ -->
<section id="ecran-liste" class="ecran" hidden>
  <header class="barre">
    <button class="btn-icone" data-aller="accueil" aria-label="Retour"><svg class="ic"><use href="icones/tabler.svg#arrow-left"></use></svg></button>
    <button id="icone-liste" class="choix-icone" aria-label="Changer l'icône de la liste"></button>
    <input id="nom-liste" class="titre-modifiable" aria-label="Nom de la liste">
    <button id="btn-suppr-liste" class="btn-icone" aria-label="Supprimer la liste"><svg class="ic"><use href="icones/tabler.svg#trash"></use></svg></button>
  </header>
  <div id="grille-liste"></div>
  <div id="objets-liste"></div>
  <!-- Formulaire d'ajout, toujours en bas -->
  <form id="form-objet" class="form-ajout" autocomplete="off">
    <input id="objet-nom" placeholder="Objet à ajouter" required>
    <div class="form-ligne">
      <select id="objet-sac" aria-label="Contenant"></select>
      <input id="objet-qte" type="number" min="1" max="99" placeholder="Qté" aria-label="Quantité">
      <button class="btn-principal coul-jaune" aria-label="Ajouter"><svg class="ic"><use href="icones/tabler.svg#plus"></use></svg></button>
    </div>
  </form>
</section>

<!-- ============ ÉCRAN 4 : RÉGLAGES ============ -->
<section id="ecran-reglages" class="ecran" hidden>
  <header class="barre">
    <button class="btn-icone" data-aller="accueil" aria-label="Retour"><svg class="ic"><use href="icones/tabler.svg#arrow-left"></use></svg></button>
    <h1 class="titre">Réglages</h1>
  </header>

  <h2 class="section"><span>Contenants</span><span id="nb-contenants"></span></h2>
  <p class="aide">Touche une icône pour la changer. « Poches » reste toujours en premier.</p>
  <div id="liste-sacs"></div>
  <form id="form-sac" class="form-ligne" autocomplete="off">
    <input id="sac-nom" placeholder="Nouveau sac (ex. Sacoche)" required>
    <button class="btn-principal coul-jaune" aria-label="Ajouter le sac"><svg class="ic"><use href="icones/tabler.svg#plus"></use></svg></button>
  </form>

  <h2 class="section"><span>Sauvegarde Excel</span></h2>
  <div class="boutons">
    <button id="btn-export" class="btn"><svg class="ic"><use href="icones/tabler.svg#download"></use></svg>Exporter</button>
    <button id="btn-import" class="btn"><svg class="ic"><use href="icones/tabler.svg#upload"></use></svg>Importer</button>
    <input id="fichier-import" type="file" accept=".xlsx" hidden>
  </div>

  <h2 class="section"><span>Compte</span></h2>
  <p id="compte-info" class="aide"></p>
  <div class="boutons">
    <button id="btn-deconnexion" class="btn"><svg class="ic"><use href="icones/tabler.svg#logout"></use></svg>Se déconnecter</button>
  </div>

  <p class="version">Stuff to go · <span id="version"></span></p>
</section>

<!-- Petit message en bas de l'écran (« Élément supprimé — Annuler ») -->
<div id="toast" class="toast" hidden>
  <span id="toast-texte"></span>
  <button id="toast-annuler">Annuler</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
